<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 64">
  <defs>
    <!-- Single gradient band spanning icon + wordmark -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="9" y1="32" x2="168" y2="32">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Icon: proportionally scaled from the standalone mark (14px → 10px, same geometry) -->

  <!-- Pipe | -->
  <rect x="9" y="8" width="10" height="48" rx="5" fill="url(#g)"/>

  <!-- Chevron > -->
  <polyline
    points="23,8 52,32 23,56"
    fill="none"
    stroke="url(#g)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Wordmark — same gradient, reads as one continuous sweep -->
  <text
    x="65"
    y="32"
    dominant-baseline="central"
    font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="-0.5"
    fill="url(#g)"
  >tyneq</text>
</svg>
