<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1A2E"/>
      <stop offset="100%" stop-color="#0A1520"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="280" height="72" rx="14" fill="url(#bgGrad)"/>

  <!-- Icon: |> scaled to fit ~48x48 at position (12, 12) -->
  <g transform="translate(12, 12) scale(0.48)">
    <rect x="22" y="22" width="11" height="56" rx="5.5" fill="url(#markGrad)" filter="url(#glow)"/>
    <polyline
      points="43,22 72,50 43,78"
      fill="none"
      stroke="url(#markGrad)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#glow)"
    />
  </g>

  <!-- Wordmark: tyneq -->
  <text
    x="74"
    y="46"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="32"
    font-weight="700"
    letter-spacing="-1"
    fill="url(#textGrad)"
  >tyneq</text>
</svg>
