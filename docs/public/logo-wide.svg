<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 64">
  <defs>
    <!--
      Single gradient band sweeping left-to-right across the entire logo —
      blue at the pipe, transitioning to cyan through the wordmark.
    -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="8" y1="32" x2="168" y2="32">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Pipe | (proportionally scaled from icon: 13px stroke, 56px tall) -->
  <rect x="8" y="6" width="10" height="52" rx="5" fill="url(#g)"/>

  <!-- Chevron > (13px stroke scaled to match) -->
  <polyline
    points="25,6 50,32 25,58"
    fill="none"
    stroke="url(#g)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Wordmark — shares the same gradient sweep -->
  <text
    x="62"
    y="32"
    dominant-baseline="central"
    font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="-0.5"
    fill="url(#g)"
  >tyneq</text>
</svg>
