<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 64">
  <defs>
    <!--
      Single gradient band sweeping left-to-right across the entire logo —
      blue at the pipe, transitioning to cyan through the wordmark.
      This also keeps the text readable on both light and dark backgrounds.
    -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="8" y1="32" x2="162" y2="32">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Pipe | (8px wide, 56px tall, centered in 64px height) -->
  <rect x="8" y="4" width="8" height="56" rx="4" fill="url(#g)"/>

  <!-- Chevron > (proportionally matched to standalone icon) -->
  <polyline
    points="23,4 48,32 23,60"
    fill="none"
    stroke="url(#g)"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Wordmark — shares the same gradient, tied into the flow -->
  <text
    x="60"
    y="32"
    dominant-baseline="central"
    font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="-0.5"
    fill="url(#g)"
  >tyneq</text>
</svg>
