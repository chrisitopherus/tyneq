<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!--
      Horizontal gradient across the mark width.
      Pipe stays blue; chevron tip arrives at cyan — reinforces the "flow" direction.
    -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="14" y1="50" x2="82" y2="50">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!--
    14px strokes fill the canvas and give the pipe enough mass to
    visually balance the two diagonal arms of the chevron.
    Near-touching gap (1px) makes |> read as a single mark rather
    than two separate elements.
  -->

  <!-- Pipe | -->
  <rect x="14" y="12" width="14" height="76" rx="7" fill="url(#g)"/>

  <!-- Chevron > -->
  <polyline
    points="36,12 82,50 36,88"
    fill="none"
    stroke="url(#g)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
