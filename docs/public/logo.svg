<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0C1828"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A5F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="url(#bgGrad)"/>
  <!-- Inner ambient glow -->
  <rect width="100" height="100" rx="18" fill="url(#innerGlow)"/>

  <!-- Node 1: source (hollow ring with center dot) -->
  <circle cx="16" cy="50" r="9.5" fill="#0F2040" stroke="#60A5FA" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="16" cy="50" r="3.5" fill="#60A5FA" opacity="0.8" filter="url(#softGlow)"/>

  <!-- Connector 1 -->
  <line x1="26" y1="50" x2="36" y2="50" stroke="#4B8CF5" stroke-width="2" stroke-linecap="round"/>
  <path d="M 34 46 L 40 50 L 34 54" fill="none" stroke="#4B8CF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Node 2: transform (filled ring + bright core) -->
  <circle cx="50" cy="50" r="9.5" fill="#142952" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="5.5" fill="#38BDF8" filter="url(#glow)"/>

  <!-- Connector 2 -->
  <line x1="60" y1="50" x2="70" y2="50" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round"/>
  <path d="M 68 46 L 74 50 L 68 54" fill="none" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Node 3: output (solid, most vivid) -->
  <circle cx="84" cy="50" r="9.5" fill="#0E7490"/>
  <circle cx="84" cy="50" r="6" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="84" cy="50" r="2.5" fill="#BAF4FF" opacity="0.6"/>
</svg>
