<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="16" y1="50" x2="78" y2="50">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Pipe | (13px — optically heavier to balance the dual-arm chevron) -->
  <rect x="16" y="12" width="13" height="76" rx="6.5" fill="url(#g)"/>

  <!-- Chevron > (13px stroke — equal weight to pipe) -->
  <polyline
    points="43,12 78,50 43,88"
    fill="none"
    stroke="url(#g)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
